<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encryption - CryptoStego</title>
<style>
:root{--navy:#001F54;--light-blue:#E0F2FF;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Arial}
body{background:var(--light-blue);color:#333;min-height:100vh;display:flex;flex-direction:column}
header,footer{background:var(--navy);color:var(--white);padding:15px 20px}
nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo-icon{width:40px;height:40px;background:var(--white);color:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px}
nav a{color:var(--white);text-decoration:none;margin-left:20px;font-weight:500}
nav a.active{border-bottom:2px solid var(--white)}
.container{max-width:900px;margin:30px auto;padding:20px;flex:1}
.card{background:var(--white);padding:25px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h2{color:var(--navy);margin-bottom:15px}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.btn{background:var(--navy);color:var(--white);padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.alert{background:#FFF3CD;color:#856404;padding:12px;border-radius:8px;margin:15px 0;border-left:4px solid #FFC107}
canvas{max-width:100%;border:2px dashed var(--navy);border-radius:8px;margin:10px 0}
#loader{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,31,84,0.8);display:none;justify-content:center;align-items:center;z-index:999}
.spinner{border:6px solid var(--light-blue);border-top:6px solid var(--white);border-radius:50%;width:60px;height:60px;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
</style>
</head><body>
<div id="loader"><div class="spinner"></div></div>
<header><nav><div class="logo"><div class="logo-icon">CS</div> CryptoStego</div>
<div><a href="index.html">Home</a><a href="encryption.html" class="active">Encryption</a><a href="decryption.html">Decryption</a></div></nav></header>

<div class="container">
  <div class="card">
    <h2>Encrypt & Hide Message</h2>
    <div class="alert"><b>IMPORTANT:</b> After downloading, send the image as a <b>DOCUMENT</b> on WhatsApp/Telegram. If you send as "Image" it will be compressed and the message will be lost!</div>

    <label><b>1. Choose Cover Image - Use PNG for best results</b></label>
    <input type="file" id="imgInput" accept="image/*">
    <canvas id="canvas"></canvas>

    <label><b>2. Secret Message</b></label>
    <textarea id="secretMsg" rows="4"></textarea>

    <label><b>3. Encryption Password</b></label>
    <input type="password" id="encPass">

    <button class="btn" onclick="encryptAndHide()">Encrypt & Download Image</button>
    <p id="status"></p>
  </div>
</div>
<footer style="text-align:center">&copy; 2026 CryptoStego</footer>

<script>
function showLoader(){document.getElementById('loader').style.display='flex'}
function hideLoader(){document.getElementById('loader').style.display='none'}

function xorEncrypt(text, key){
  let result = '';
  for(let i=0; i<text.length; i++) result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return btoa(result);
}

let img = new Image(); let canvas = document.getElementById('canvas'); let ctx = canvas.getContext('2d');
imgInput.onchange = e => { let file = e.target.files[0]; let reader = new FileReader();
  reader.onload = evt => { img.src = evt.target.result; }
  reader.readAsDataURL(file);
}
img.onload = () => { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img,0,0); }

function encryptAndHide(){
  if(!img.src) return alert("Select an image first");
  if(!secretMsg.value ||!encPass.value) return alert("Enter message and password");
  showLoader();
  setTimeout(()=>{
    let encrypted = xorEncrypt(secretMsg.value, encPass.value);
    let data = "###CRYPTO_STEGO_START###" + encrypted + "###CRYPTO_STEGO_END###";

    let imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let binary = '';
    for(let i=0;i<data.length;i++){
      let bits = data.charCodeAt(i).toString(2).padStart(8,'0');
      binary += bits.split('').map(b => b+b+b).join(''); // repeat each bit 3 times
    }

    if(binary.length > imgData.data.length/4*3) {hideLoader(); return alert("Message too long for this image");}

    let idx = 0;
    for(let i=0;i<imgData.data.length;i+=4){
      if(idx < binary.length){
        let bit = parseInt(binary[idx]); idx+=3; // skip the 2 repeated bits
        imgData.data[i] = (imgData.data[i] & 0xFE) | bit;
        imgData.data[i+1] = (imgData.data[i+1] & 0xFE) | bit;
        imgData.data[i+2] = (imgData.data[i+2] & 0xFE) | bit;
      }
    }
    ctx.putImageData(imgData,0,0);
    let link = document.createElement('a');
    link.download = "stego_secure.png";
    link.href = canvas.toDataURL("image/png"); // force PNG
    link.click();
    status.innerText = "Done! Remember to send as DOCUMENT";
    hideLoader();
  },500);
}
</script>
</body></html>

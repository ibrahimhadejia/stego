<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decryption - CryptoStego</title>
<style>
:root{--navy:#001F54;--light-blue:#E0F2FF;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Arial}
body{background:var(--light-blue);color:#333;min-height:100vh;display:flex;flex-direction:column}
header,footer{background:var(--navy);color:var(--white);padding:15px 20px}
nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo-icon{width:40px;height:40px;background:var(--white);color:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px}
nav a{color:var(--white);text-decoration:none;margin-left:20px;font-weight:500}
nav a.active{border-bottom:2px solid var(--white)}
.container{max-width:900px;margin:30px auto;padding:20px;flex:1}
.card{background:var(--white);padding:25px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h2{color:var(--navy);margin-bottom:15px}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.btn{background:var(--navy);color:var(--white);padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.alert{background:#D4EDDA;color:#155724;padding:12px;border-radius:8px;margin:15px 0;border-left:4px solid #28A745}
#loader{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,31,84,0.8);display:none;justify-content:center;align-items:center;z-index:999}
.spinner{border:6px solid var(--light-blue);border-top:6px solid var(--white);border-radius:50%;width:60px;height:60px;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
</style>
</head><body>
<div id="loader"><div class="spinner"></div></div>
<header><nav><div class="logo"><div class="logo-icon">CS</div> CryptoStego</div>
<div><a href="index.html">Home</a><a href="encryption.html">Encryption</a><a href="decryption.html" class="active">Decryption</a></div></nav></header>

<div class="container">
  <div class="card">
    <h2>Extract & Decrypt Message</h2>
    <div class="alert"><b>TIP:</b> Ask the sender to send the image as "Document" not as "Image" to avoid compression.</div>

    <label><b>1. Upload Stego Image</b></label>
    <input type="file" id="imgInput2" accept="image/*">
    <canvas id="canvas2" style="display:none"></canvas>

    <label><b>2. Decryption Password</b></label>
    <input type="password" id="decPass">

    <button class="btn" onclick="extractAndDecrypt()">Extract Message</button>

    <label><b>3. Extracted Message</b></label>
    <textarea id="outputMsg" rows="4" readonly></textarea>
    <p id="status2"></p>
  </div>
</div>
<footer style="text-align:center">&copy; 2026 CryptoStego</footer>

<script>
function showLoader(){document.getElementById('loader').style.display='flex'}
function hideLoader(){document.getElementById('loader').style.display='none'}

function xorDecrypt(text, key){
  let result = ''; let decoded = atob(text);
  for(let i=0; i<decoded.length; i++) result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return result;
}

let img2 = new Image(); let canvas2 = document.getElementById('canvas2'); let ctx2 = canvas2.getContext('2d');
imgInput2.onchange = e => { let file = e.target.files[0]; let reader = new FileReader();
  reader.onload = evt => { img2.src = evt.target.result; }
  reader.readAsDataURL(file);
}
img2.onload = () => { canvas2.width = img2.width; canvas2.height = img2.height; ctx2.drawImage(img2,0,0); }

function extractAndDecrypt(){
  if(!img2.src) return alert("Upload stego image first");
  if(!decPass.value) return alert("Enter password");
  showLoader();
  setTimeout(()=>{
    let imgData = ctx2.getImageData(0,0,canvas2.width,canvas2.height);
    let bits = [];
    for(let i=0;i<imgData.data.length;i+=4){
      let b1 = imgData.data[i] & 1;
      let b2 = imgData.data[i+1] & 1;
      let b3 = imgData.data[i+2] & 1;
      // Majority vote: 2 out of 3
      bits.push((b1+b2+b3) >= 2? 1 : 0);
    }
    let binary = bits.join('');
    let chars = [];
    for(let i=0;i<binary.length;i+=8) chars.push(String.fromCharCode(parseInt(binary.substr(i,8),2)));
    let data = chars.join('');
    let start = data.indexOf("###CRYPTO_STEGO_START###");
    let end = data.indexOf("###CRYPTO_STEGO_END###");
    if(start == -1 || end == -1){hideLoader(); return status2.innerText = "No hidden message found or image was compressed";}
    let msg = data.substring(start+25, end);
    try{
      outputMsg.value = xorDecrypt(msg, decPass.value);
      status2.innerText = "Success! Message extracted."; status2.style.color = "green";
    }catch(e){
      status2.innerText = "Wrong password"; status2.style.color = "red";
    }
    hideLoader();
  },500);
}
</script>
</body></html>
